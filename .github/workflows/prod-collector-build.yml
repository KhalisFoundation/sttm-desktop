# Shadower prod-collector smoke-test installers (fork only; this branch only). Built the way
# Khalis builds releases (build-windows.yml / build-mac.yml: same runners, same dependency
# install, electron-builder via the same configs), except: no code signing or notarization,
# no publishing, and the installers are kept as workflow artifacts. No speech model. The
# Azure upload SAS is injected only if the VF_UPLOAD_SAS secret exists (otherwise the build
# simply does not upload sessions).
name: Prod collector build

on:
  workflow_dispatch:
  push:
    branches:
      - vf-prod-collector-dev

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022: node-gyp 9 (pinned by the lockfile) does not recognise the Visual
          # Studio 2026 on windows-latest.
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: macArm
          - os: macos-15-intel
            platform: macX64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      BONJOUR_SDK_HOME: 'C:\Program Files\Bonjour SDK'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 (node-gyp compatible)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure setuptools (distutils replacement)
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Set node-gyp Python path
        shell: bash
        run: echo "npm_config_python=$pythonLocation/python${{ matrix.platform == 'win' && '.exe' || '3' }}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Install Bonjour SDK
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/Bonjour64.msi" -OutFile "Bonjour64.msi"
          Start-Process msiexec.exe -ArgumentList "/i Bonjour64.msi /qn" -Wait
          Remove-Item Bonjour64.msi
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/bonjoursdksetup.exe" -OutFile "bonjoursdksetup.exe"
          Start-Process bonjoursdksetup.exe -ArgumentList "/quiet" -Wait
          Remove-Item bonjoursdksetup.exe

      - name: Install dependencies
        shell: bash
        run: |
          npm install -g npm@9.8.1
          npm install --legacy-peer-deps

      - name: Exclude research data from the installer
        shell: bash
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));if(!p.build.files.includes("!research${/*}"))p.build.files.push("!research${/*}");fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Build (npm run build, as pack:* does; postbuild injects the upload SAS if set)
        shell: bash
        env:
          VF_UPLOAD_SAS: ${{ secrets.VF_UPLOAD_SAS }}
        run: npm run build

      # The electron-builder half of pack:win / pack:macArm, with publishing off, plus
      # npmRebuild=false: the postinstall (electron-builder install-app-deps) already built the
      # native modules for Electron, and electron-builder's second rebuild stalls on GitHub's
      # runners while fetching sharp's binary (runs 1-5 and 10 hung there).
      - name: Package (Windows, as pack:win)
        if: matrix.platform == 'win'
        timeout-minutes: 60
        shell: bash
        run: npx electron-builder --win --x64 --publish never -c.npmRebuild=false

      - name: Package (macOS Apple Silicon, as pack:mac but arm64, unsigned)
        if: matrix.platform == 'macArm'
        timeout-minutes: 60
        shell: bash
        # As pack:macArm: its own config file (packaging/electron-builder.macArm.yml).
        run: |
          npm run rebuild-sqlite
          npx electron-builder -c packaging/electron-builder.macArm.yml --mac dmg zip --arm64 --publish never -c.npmRebuild=false -c.mac.identity=null

      - name: Package (macOS Intel, as pack:mac, unsigned)
        if: matrix.platform == 'macX64'
        timeout-minutes: 60
        shell: bash
        run: npx electron-builder --mac dmg zip --x64 --publish never -c.npmRebuild=false

      - name: Checks on the output
        shell: bash
        run: |
          # pack:macArm's config writes to dist/, the others to builds/.
          out=builds; [ -d dist ] && out=dist
          ls -la $out/ | grep -E "\.exe$|\.dmg$|\.zip$"
          # No speech model and no onnxruntime anywhere in the output.
          if find $out -iname "*onnx*" | grep -q .; then echo "onnx found in the build"; exit 1; fi
          echo "no onnx files in the build"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-collector-${{ matrix.platform }}
          path: |
            builds/*.exe
            builds/*.dmg
            builds/*.zip
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
