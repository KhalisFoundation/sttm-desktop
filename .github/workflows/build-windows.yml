name: Build Windows App

on:
  push:
    branches:
      - dev
      - master
      - release

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ia32]
    env:
      BONJOUR_SDK_HOME: 'C:\\Program Files\\Bonjour SDK'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      AUDIO_TRANSCRIPT_API: ${{ secrets.AUDIO_TRANSCRIPT_API }}
      AUDIO_TRANSCRIPT_API_KEY: ${{ secrets.AUDIO_TRANSCRIPT_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 (node-gyp compatible)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure setuptools (distutils replacement)
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Set node-gyp Python path
        run: |
          echo "npm_config_python=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Install Bonjour SDK
        run: |
          # Download and install Bonjour SDK
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/Bonjour64.msi" -OutFile "Bonjour64.msi"
          Start-Process msiexec.exe -ArgumentList "/i Bonjour64.msi /qn" -Wait
          Remove-Item Bonjour64.msi
          
          # Download and install Bonjour SDK Setup
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/bonjoursdksetup.exe" -OutFile "bonjoursdksetup.exe"
          Start-Process bonjoursdksetup.exe -ArgumentList "/quiet" -Wait
          Remove-Item bonjoursdksetup.exe

      - name: Clean node_modules
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Install dependencies
        run: |
          npm install -g npm@9.8.1
          npm install --legacy-peer-deps

      # The runner is 64-bit, so npm install fetches 64-bit native binaries.
      # electron-builder's ia32 rebuild doesn't replace them all: it skips
      # realm (no binding.gyp) and re-fetches only sharp.node, not the libvips
      # DLLs sharp downloads at install. The 32-bit app then shipped a 64-bit
      # realm.node and libvips, couldn't load them, and opened blank (#2196).
      - name: Fetch 32-bit native modules
        if: matrix.arch == 'ia32'
        env:
          npm_config_arch: ia32
          REALM_DISABLE_ANALYTICS: '1'
        run: |
          Remove-Item node_modules/sharp/build, node_modules/sharp/vendor -Recurse -Force -ErrorAction SilentlyContinue
          npm rebuild realm sharp

      - name: Check the native modules match the build
        run: |
          # PE machine type: 0x14c is 32-bit (x86), 0x8664 is 64-bit (x64).
          $expected = if ("${{ matrix.arch }}" -eq "ia32") { 0x14c } else { 0x8664 }
          $files = @('node_modules/realm/build/Release/realm.node') + (Get-ChildItem node_modules/sharp/build/Release -Include *.node, *.dll -Recurse).FullName
          foreach ($f in $files) {
            $bytes = [IO.File]::ReadAllBytes($f)
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
            if ($machine -ne $expected) { throw ("{0}: machine 0x{1:x}, expected 0x{2:x}" -f $f, $machine, $expected) }
            Write-Host ("{0}: ok" -f $f)
          }

      - name: Build for ${{ matrix.arch }}
        run: |
          # Configure git for GitHub Actions
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Run release script with appropriate platform
          if ("${{ matrix.arch }}" -eq "x64") {
            node packaging/release --branch=${{ github.ref_name }} --platform=win --token=${{ secrets.GITHUB_TOKEN }}
          } else {
            node packaging/release --branch=${{ github.ref_name }} --platform=win32 --token=${{ secrets.GITHUB_TOKEN }}
          }
