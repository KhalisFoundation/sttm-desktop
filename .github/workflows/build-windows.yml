name: Build Windows App

on:
  push:
    branches:
      - dev
      - master
      - release
      - experimental-release

jobs:
  build-windows:
    # Pinned: windows-latest ships Visual Studio 2026, which node-gyp 9 can't detect (needed for mdns)
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, ia32]
        # Experimental releases only ship the 64-bit build
        exclude:
          - arch: ${{ github.ref_name == 'experimental-release' && 'ia32' || '' }}
    env:
      BONJOUR_SDK_HOME: 'C:\\Program Files\\Bonjour SDK'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      AUDIO_TRANSCRIPT_API: ${{ secrets.AUDIO_TRANSCRIPT_API }}
      AUDIO_TRANSCRIPT_API_KEY: ${{ secrets.AUDIO_TRANSCRIPT_API_KEY }}
      # Voice-Follow shadow uploads (Azure Blob SAS); injected after npm run build. Optional:
      # without it the build still succeeds and the app simply does not upload sessions.
      VF_UPLOAD_SAS: ${{ secrets.VF_UPLOAD_SAS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11 (node-gyp compatible)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure setuptools (distutils replacement)
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Set node-gyp Python path
        run: |
          echo "npm_config_python=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.0'

      - name: Install Bonjour SDK
        run: |
          # Download and install Bonjour SDK
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/Bonjour64.msi" -OutFile "Bonjour64.msi"
          Start-Process msiexec.exe -ArgumentList "/i Bonjour64.msi /qn" -Wait
          Remove-Item Bonjour64.msi
          
          # Download and install Bonjour SDK Setup
          Invoke-WebRequest -Uri "https://github.com/KhalisFoundation/sttm-desktop/raw/master/assets/bonjoursdksetup.exe" -OutFile "bonjoursdksetup.exe"
          Start-Process bonjoursdksetup.exe -ArgumentList "/quiet" -Wait
          Remove-Item bonjoursdksetup.exe

      - name: Clean node_modules
        run: |
          if (Test-Path node_modules) {
            Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Install dependencies
        run: |
          npm install -g npm@9.8.1
          npm install --legacy-peer-deps

      - name: Speech model (Voice-Follow, bundled into the installer)
        shell: bash
        run: |
          mkdir -p build-resources/voice-follow
          curl -L --retry 3 -o build-resources/voice-follow/model.int8.onnx \
            "https://huggingface.co/karansea/indicconformer-stt-pa-ctc-shabad-preview/resolve/main/model.int8.onnx?download=true"
          SIZE=$(wc -c < build-resources/voice-follow/model.int8.onnx | tr -d ' ')
          echo "model bytes: $SIZE"; test "$SIZE" -gt 180000000

      - name: Build for ${{ matrix.arch }}
        run: |
          # Configure git for GitHub Actions
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Run release script with appropriate platform
          if ("${{ matrix.arch }}" -eq "x64") {
            node packaging/release --branch=${{ github.ref_name }} --platform=win --token=${{ secrets.GITHUB_TOKEN }}
          } else {
            node packaging/release --branch=${{ github.ref_name }} --platform=win32 --token=${{ secrets.GITHUB_TOKEN }}
          }
