<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SikhiToTheMax Viewer</title>
    <link rel="stylesheet" href="assets/css/bundle.css" />
    <link rel="stylesheet" href="assets/css/vendor/font-awesome.min.css" />
    <link rel="stylesheet" href="assets/css/vendor/tingle.css" />
  </head>
  <body class="viewer">
    <div id="viewer-container"></div>
    <script>
        const { ipcRenderer } = require('electron');
        const React = require('react');
        let root = null;

        ipcRenderer.on('wc-webview-enabled', () => {
          const app = require('./js/viewer/viewerApp.js').default;
          const { createRoot } = require('react-dom/client');

          if (!root) {
            root = createRoot(document.getElementById('viewer-container'));
          }
          // `createElement`, not `app()`. Calling it here would run its body
          // outside React's render, leaving the hook dispatcher unset, and any
          // hook it uses would throw before the tree could mount.
          root.render(React.createElement(app));
        });
    </script>
  </body>
</html>
