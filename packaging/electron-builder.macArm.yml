files:
  - "**/*"
  - "!assets${/*}"
  - "!builds${/*}"
  - "!**/scss${/*}"
  - "!packaging${/*}"
  - "!test${/*}"
  - "!www/node_modules${/*}"
  - "!www/package.json"
  - "!**/{.eslintignore,.eslintrc,.gitmodules,.htmlhintrc,.stylelintrc,.travis.yml,appveyor.yml,data.db,id_rsa.enc,README,STTM.provisionprofile}"
  - "!**/*.map"
  - "!www/main/**/*.{js,jsx}"
  - "!www/assets/*.db"

asarUnpack:
  - node_modules/better-sqlite3/**/*

npmRebuild: false

extraResources:
  - data.db
  - from: www/assets
    to: assets
    filter:
      - "*.db"

publish:
  provider: s3
  bucket: sttm-releases
  path: mac-${arch}
  region: us-west-2

mac:
  category: "public.app-category.reference"
  icon: "assets/STTM.icns"
  hardenedRuntime: true
  artifactName: "SikhiToTheMax-${version}-${os}-${arch}.${ext}"
  entitlements: "./entitlements.mac.inherit.plist"
  # Same as package.json: macOS ends an app that opens the microphone without this text, and
  # the Shadower collector opens it automatically.
  extendInfo:
    NSMicrophoneUsageDescription: "STTM uses the microphone for voice search and, if you allow it, to share diwan audio that helps improve Shabad search"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  notarize:
    teamId:
afterSign: "./notarize.js"
