publish:
  provider: s3
  bucket: sttm-releases
  path: mac-${arch}
  region: us-west-2

mac:
  category: "public.app-category.reference"
  icon: "assets/STTM.icns"
  hardenedRuntime: true
  artifactName: "SikhiToTheMax-${version}-${os}-${arch}.${ext}"
  entitlements: "./entitlements.mac.inherit.plist"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  notarize:
    teamId:
afterSign: "./notarize.js"
# Voice-Follow: the speech model ships beside the app (fetched into build-resources before packaging)
extraResources:
  - from: "build-resources/voice-follow/model.int8.onnx"
    to: "voice-follow/model.int8.onnx"
files:
  - "!research${/*}"
  - "!build-resources${/*}"
